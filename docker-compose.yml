services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: roadmap
      POSTGRES_DB: roadmap
    ports:
      - "5432:5432"
    volumes:
      - roadmap_pgdata:/var/lib/postgresql/data

volumes:
  roadmap_pgdata:
