name: lifecairn
services:
  app:
    image: ${APP_IMAGE:?Set the ECR app image URI and release tag}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lifecairn:${POSTGRES_PASSWORD:?Set a URL-safe database password}@db:5432/lifecairn
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set Clerk secret key}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      MANIFESTATION_APP_URL: https://${MANIFESTATION_SITE_ADDRESS:?Set the Manifestation domain}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
  # Standalone Manifestation app (separate repo), sharing Postgres via its own
  # "manifestation" database and the same Clerk instance as LifeCairn.
  manifestation:
    image: ${MANIFESTATION_IMAGE:?Set the ECR Manifestation image URI and release tag}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lifecairn:${POSTGRES_PASSWORD}@db:5432/manifestation
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      ALLOWED_USER_IDS: ${MANIFESTATION_ALLOWED_USER_IDS:?Set the Clerk user ids allowed into Manifestation}
      APP_URL: https://${MANIFESTATION_SITE_ADDRESS}
      # Reminders and reports: email (any SMTP) and/or Telegram. Unset = that channel is off.
      SMTP_HOST: ${MANIFESTATION_SMTP_HOST:-}
      SMTP_PORT: ${MANIFESTATION_SMTP_PORT:-587}
      SMTP_USER: ${MANIFESTATION_SMTP_USER:-}
      SMTP_PASS: ${MANIFESTATION_SMTP_PASS:-}
      SMTP_FROM: ${MANIFESTATION_SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${MANIFESTATION_TELEGRAM_BOT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3001:3000"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifecairn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lifecairn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifecairn -d lifecairn"]
      interval: 5s
      timeout: 5s
      retries: 20
  tools:
    profiles: ["tools"]
    image: ${TOOLS_IMAGE:?Set the ECR tools image URI and matching release tag}
    environment:
      DATABASE_URL: postgresql://lifecairn:${POSTGRES_PASSWORD}@db:5432/lifecairn
    depends_on:
      db:
        condition: service_healthy
  manifestation-tools:
    profiles: ["tools"]
    image: ${MANIFESTATION_TOOLS_IMAGE:?Set the ECR Manifestation tools image URI}
    environment:
      DATABASE_URL: postgresql://lifecairn:${POSTGRES_PASSWORD}@db:5432/manifestation
    depends_on:
      db:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the public domain}
      MANIFESTATION_SITE_ADDRESS: ${MANIFESTATION_SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - manifestation
volumes:
  pgdata:
  caddy_data:
  caddy_config:
